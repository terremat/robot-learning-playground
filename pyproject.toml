[project]
authors = [{name = "Matteo Terreran", email = "matteo.terreran@gmail.com"}]
dependencies = []
name = "robot-learning-playground"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
robot_learning_playground = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.12.*"
numpy = ">=2.5.3,<3"
matplotlib = ">=3.11.2,<4"
jupyterlab = ">=4.6.4,<5"
ipykernel = ">=7.4.0,<8"
pytorch = ">=2.10,<2.11"
gym-pusht = ">=0.1.6,<0.2"
pymunk = ">=6.6,<7"
lerobot = ">=0.6.1,<0.7"
lerobot-dataset = ">=0.6.1,<0.7"
transformers = ">=5.19.0,<6"
