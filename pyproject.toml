[project]
authors = [{name = "Matteo Terreran", email = "matteo.terreran@gmail.com"}]
dependencies = []
name = "robot-learning-playground"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
    "linux-64",
    "osx-arm64",
    { name = "linux-64-cuda", platform = "linux-64", cuda = "12" },
]

[tool.pixi.pypi-dependencies]
robot_learning_playground = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.12.*"
numpy = ">=2.5.3,<3"
matplotlib = ">=3.11.2,<4"
jupyterlab = ">=4.6.4,<5"
ipykernel = ">=7.4.0,<8"
gym-pusht = ">=0.1.6,<0.2"
pymunk = ">=6.6,<7"
lerobot = ">=0.6.1,<0.7"
lerobot-dataset = ">=0.6.1,<0.7"
transformers = ">=5.19.0,<6"

[tool.pixi.environments]
default = ["cpu"]

[tool.pixi.environments.cuda]
features = ["cuda"]

# CPU / Apple MPS
[tool.pixi.feature.cpu]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.feature.cpu.dependencies]
pytorch-cpu = ">=2.10,<2.11"
torchvision = "*"

# NVIDIA CUDA - Linux only
[tool.pixi.feature.cuda]
platforms = ["linux-64-cuda"]

[tool.pixi.feature.cuda.dependencies]
pytorch-gpu = ">=2.10,<2.11"
torchvision = "*"

[tool.pixi.feature.cuda.pypi-dependencies]
hf-libero = ">=0.1.4,<0.2"

[dependency-groups]
cuda = ["num2words>=0.5.14,<0.6"]
